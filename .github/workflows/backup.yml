# Nightly database backup.
# Takes a full dump of the Supabase database every night (03:00 Israel), encrypts
# it with a passphrase (the data includes health declarations), and keeps it as
# a GitHub artifact for 30 days. Can also be run by hand: Actions → Backup → Run.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     the Session pooler connection string from Supabase
#                       (Connect → Session pooler), with the database password in it
#   BACKUP_PASSPHRASE   a long password; without it the backup cannot be opened
#
# To restore: download the artifact, then
#   gpg --decrypt sst-YYYY-MM-DD.dump.gpg > sst.dump
#   pg_restore --clean --no-owner -d "<connection string>" sst.dump
name: Backup

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 03:00/04:00 Israel
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then
            echo "::error::Set SUPABASE_DB_URL and BACKUP_PASSPHRASE in the repository secrets."
            exit 1
          fi

      - name: Dump the database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm -e DB_URL -v "$PWD:/out" postgres:17 \
            sh -c 'pg_dump "$DB_URL" --format=custom --no-owner --no-privileges \
                    --schema=public --schema=auth --schema=storage \
                    --file=/out/sst.dump'
          ls -lh sst.dump

      - name: Encrypt
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="sst-$(date -u +%F).dump.gpg"
          echo "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$name" sst.dump
          rm sst.dump
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Keep for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}
          retention-days: 30
          if-no-files-found: error
